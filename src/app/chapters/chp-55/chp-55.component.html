<h1>API Call Service</h1>
<hr>
<form #userForm="ngForm" (ngSubmit)="addUser(userForm.value)">
    <input type="text" name="name" placeholder="Enter name" id="" [ngModel]="selectedUser?.name">
    <br><br>
    <input type="text" name="email" placeholder="Enter email" id="" [ngModel]="selectedUser?.email">
    <br><br>
    <input type="text" name="age" placeholder="Enter age" id="" [ngModel]="selectedUser?.age">
    <br><br>
    @if(!selectedUser) {
        <button>Add User</button>
    }
    @else {
        <button>Update User</button>
    }
</form>
<hr>
@for(user of users; track user) {
    <ul>
        <li><b>Name:</b> {{user.name}}</li>
        <li><b>Age:</b> {{user.age}}</li>
        <li><b>Email Address:</b> {{user.email}}</li>
        <button (click)="deleteUser(user.id)">DELETE</button>&nbsp;<button (click)="selectUser(user.id)">UPDATE</button>
    </ul>
} 
<hr>
